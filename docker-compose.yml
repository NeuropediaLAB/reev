version: '3.8'

services:
  # PostgreSQL - Base de datos principal
  postgres:
    image: postgres:15-alpine
    container_name: reev-postgres
    environment:
      POSTGRES_USER: reev
      POSTGRES_PASSWORD: reev_password
      POSTGRES_DB: reev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - reev-network

  # Redis - Cache
  redis:
    image: redis:7-alpine
    container_name: reev-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - reev-network

  # Annonars - Servicio de anotaciones
  annonars:
    build:
      context: ./annonars
      dockerfile: utils/docker/Dockerfile
    ports:
      - "3010:8080"
    environment:
      - RUST_LOG=info
    volumes:
      - ./data/annonars:/data:ro
      - ./data/sources:/sources:ro
      - ./data/grch37:/data/grch37:rw
      - ./data/grch38:/data/grch38:rw
    restart: unless-stopped
    networks:
      - reev-network
    depends_on:
      - postgres
      - redis

  # Mehari - Consecuencias moleculares
  mehari:
    build:
      context: ./mehari
      dockerfile: utils/docker/Dockerfile
    container_name: reev-mehari
    ports:
      - "3011:8080"
    environment:
      - RUST_LOG=info
      - PATH_DB=/data
    volumes:
      - ./data/mehari:/data:ro
    restart: unless-stopped
    networks:
      - reev-network
    depends_on:
      - postgres
      - redis

  # REEV Frontend + Backend
  reev:
    build:
      context: ./reev-frontend
      dockerfile: utils/docker/Dockerfile
    container_name: reev-frontend
    ports:
      - "3020:8080"
    environment:
      - REEV_ANNONARS_URL=http://annonars:8080
      - REEV_MEHARI_URL=http://mehari:8080
      - REEV_DOTTY_URL=http://dotty:3000
      - REEV_VIGUNO_URL=http://viguno:8080
      - REEV_NGINX_URL=http://nginx:8080
      - SERVE_FRONTEND=/home/reev/ui
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=reev
      - POSTGRES_USER=reev
      - POSTGRES_PASSWORD=reev_password
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - reev-network
    depends_on:
      - annonars
      - mehari
      - postgres
      - redis

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  reev-network:
    driver: bridge
